name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm Trusted Publishing requires npm >=11.5.1.
      - name: Ensure npm supports trusted publishing
        run: npm install --global 'npm@^11.5.1'

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_TAG="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$PACKAGE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_TAG" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

      # Configure npm Trusted Publishing for RSamaium/framebrief and this exact workflow.
      # OIDC avoids storing a long-lived npm publish token in GitHub secrets.
      - name: Publish package
        run: npm publish --access public
